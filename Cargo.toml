[package]
name = "typroxy"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-rustls = "0.26"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
rcgen = "0.13"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
tun = { version = "0.6", features = ["async"] }

